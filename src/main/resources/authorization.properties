# Configuracion de autorizacion
# Formato: action=role1,role2,role3
#
# Define que roles pueden ejecutar cada accion
# 
# IMPORTANTE: 
# - Si una accion NO esta listada aqui, es PUBLICA (no requiere autenticacion)
# - Si una accion SI esta listada, requiere estar logueado con uno de los roles indicados
#
# Acciones publicas (no listadas aqui):
# - LoginAction: Cualquiera puede hacer login (obviamente)
# - LogoutAction: Cualquiera puede hacer logout

# ShowBooksAction: Tanto ADMIN como USER pueden ver el catalogo (requiere login)
ShowBooksAction=ADMIN,USER

# ShowSpecialOfferAction: Solo ADMIN puede ver ofertas especiales (requiere login)
ShowSpecialOfferAction=ADMIN
